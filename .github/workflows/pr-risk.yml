name: PR risk

# Labels each pull request with its risk class from the paths it changes.
# CONTRIBUTING.md defines the classes and who must review each one.
# This runs in the base repository context, so it never checks out or executes pull request code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    name: Label the risk class
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Classify changed paths
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > files.txt
          risk=low
          while read -r path; do
            case "$path" in
              Sources/*|Package.swift|vendor/*|scripts/*|Makefile|rust-toolchain.toml|.swift-format|\
              .github/*|.claude/*|decisions/*|docs/adr/*|LICENSE|SECURITY.md)
                risk=high
                echo "high: $path"
                ;;
            esac
          done < files.txt
          for name in low high; do
            gh label create "risk: $name" --color "$([ "$name" = high ] && echo b60205 || echo 0e8a16)" \
              --description "See the risk classes in CONTRIBUTING.md" 2>/dev/null || true
          done
          other=$([ "$risk" = high ] && echo low || echo high)
          gh pr edit "$PR_NUMBER" --add-label "risk: $risk" --remove-label "risk: $other"
          echo "### Risk: $risk" >> "$GITHUB_STEP_SUMMARY"
