name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Docs, harness, and compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      # Versions must match scripts/doctor.sh, which rejects any other version.
      - name: Install actionlint 1.7.12 and ShellCheck 0.11.0
        run: |
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLo shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          sha256sum --check <<'SUMS'
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz
          SUMS
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
          tar -xJf shellcheck.tar.xz -C "$RUNNER_TEMP" --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: make lint

  changes:
    name: Decide whether the macOS job runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.decide.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request checks out its merge commit, whose first parent is the base branch.
          fetch-depth: 2
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/ci-needs-native.py HEAD^1 >> "$GITHUB_OUTPUT"
          else
            echo native=true >> "$GITHUB_OUTPUT"
          fi

  native:
    name: Build, test, and package on macOS 27
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - name: Install pinned Rust
        id: rust
        run: |
          rustup toolchain install
          echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Only main saves, and pull requests restore main's cache. GitHub scopes a cache to the branch that saved it,
      # so pull request saves would never be read by other pull requests and would evict main's cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # The action runs cargo inside vendor/paneru, where the engine's own rust-toolchain.toml asks for stable.
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
        with:
          workspaces: vendor/paneru
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # These steps are the prerequisites of `make native`, run one by one for readable logs.
      - name: Check prerequisites
        run: make doctor
      - name: Lint Swift and engine
        run: make swift-lint engine-lint
      - name: Build
        run: make build
      - name: Unit tests
        run: make test
      - name: Selftest
        run: make e2e
      - name: Package DMG
        run: make package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miri-developer-dmg
          path: .build/Miri-Developer-*.dmg
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selftest-evidence
          path: /tmp/miri-permission-*/
          if-no-files-found: ignore
          retention-days: 14
