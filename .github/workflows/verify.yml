name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: scripts/setup.sh --profile portable
      - run: scripts/verify.sh --level portable
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-evidence
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 14
  native:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - run: rustup toolchain install
      - run: scripts/setup.sh --profile portable
      - run: scripts/setup.sh --profile native
      - run: scripts/verify.sh --level gui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-evidence
          path: .harness/runs/
          include-hidden-files: true
          retention-days: 14
