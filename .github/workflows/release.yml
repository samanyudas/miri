# The release candidate builds the stable Miri app with the release-profile engine, selftests that bundle, and packages it.
# Developer ID signing and notarization are #82.
name: Release candidate

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Makefile
      - scripts/build-app.sh
      - scripts/package-dmg.sh
      - scripts/test-permission-prototype.sh
      - scripts/test-window-recovery.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  release-candidate:
    name: Build, selftest, and package the release candidate on macOS 27
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - name: Install pinned Rust
        id: rust
        run: |
          rustup toolchain install
          echo "toolchain=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # Only main saves, and pull requests restore main's cache, as in ci.yml.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          # The action runs cargo inside vendor/paneru, where the engine's own rust-toolchain.toml asks for stable.
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.toolchain }}
        with:
          workspaces: vendor/paneru
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check prerequisites
        run: make doctor
      - name: Build, selftest, and package
        run: make release-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miri-release-candidate-dmg
          # The hex class keeps Miri-Developer-<revision>.dmg out.
          path: .build/Miri-[0-9a-f]*.dmg
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: selftest-evidence
          path: /tmp/miri-permission-*/
          if-no-files-found: ignore
          retention-days: 14
