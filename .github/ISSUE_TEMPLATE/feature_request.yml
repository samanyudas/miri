name: Feature request
description: Propose a change to Miri's behavior or settings
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Check [release scope](https://github.com/samanyudas/miri/blob/main/decisions/release-scope.md) and the [v2 roadmap](https://github.com/samanyudas/miri/blob/main/decisions/v2-roadmap.md) first.
        Some features are deliberately deferred.
        Write the title as one plain sentence about what changes for the person using Miri, such as "Each display scrolls its own strip".
        Do not file an issue without a real need and evidence for it.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
