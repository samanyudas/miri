name: Feature request
description: Propose a change to Miri's behavior or settings
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Check [release scope](https://github.com/samanyudas/miri/blob/main/decisions/release-scope.md) and the [v2 roadmap](https://github.com/samanyudas/miri/blob/main/decisions/v2-roadmap.md) first.
        Some features are deliberately deferred.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results that show the feature works. One per line.
      placeholder: |
        - With two displays, the strip on each display scrolls independently.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
