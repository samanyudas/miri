name: Task or spec
description: A scoped piece of work for a contributor or an agent
labels: [needs-triage]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done, and who notices?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link the decisions, ADRs, and issues this depends on.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checks a reviewer can run. Include the command or the manual steps.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification level
      description: Which make targets must pass, and whether hardware or a manual permission grant is required.
      placeholder: make check, plus the two-display quick check in decisions/v1-acceptance-checklist.md
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
